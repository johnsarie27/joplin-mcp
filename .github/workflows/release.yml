name: release
run-name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # v1.0.0

permissions:
  contents: write # required for creating the release
  actions: none
  issues: none
  pull-requests: none
  id-token: none

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: sanity-check package imports
        run: uv run python -c "import joplin_mcp.server, joplin_mcp.client, joplin_mcp.config"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
