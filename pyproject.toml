[project]
name = "joplin-mcp"
version = "0.5.1"
description = "MCP server for Joplin note-taking app"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.1.4",
    "httpx>=0.27.0",
]

[project.scripts]
joplin-mcp-server = "joplin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/joplin_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
